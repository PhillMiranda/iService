<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iService — encontre um prestador</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <main class="wrap">
    <h1>Encontre o profissional certo</h1>
    <p class="sub">Eletricista, maquiadora, professor particular e muito mais — perto de você.</p>

    <div class="barra-busca">
      <input id="busca" type="search" placeholder="Buscar serviço ou profissional...">
    </div>
    <div class="filtros" id="filtros"></div>

    <div class="grade" id="lista"></div>
    <div class="vazio" id="vazio" hidden>Nenhum serviço encontrado.</div>
  </main>
  <script type="module" src="js/home.js"></script>
</body>
</html>
